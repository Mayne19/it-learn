name: Supabase keepalive

# Supabase Free met un projet en pause après ~7 jours sans activité. Ce job
# fait une requête légère toutes les 3 jours pour empêcher la pause, sans
# jamais migrer de plateforme (voir discussion dans le projet — Appwrite
# aurait demandé de réécrire toute l'auth/données/storage, y compris le
# mode Klausur existant, pour un problème résolu ici sans code applicatif).
on:
  schedule:
    - cron: "0 9 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL ou SUPABASE_ANON_KEY manquant dans les secrets du repo — voir docs/db-anpassung.md pour les récupérer dans Project Settings > API."
            exit 1
          fi
          curl -sf "$SUPABASE_URL/rest/v1/study_courses?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -o /dev/null
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
